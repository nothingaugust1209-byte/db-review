<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>データベース応用 テスト対策</title>
<style>
  :root{
    --bg:#0f172a; --card:#1e293b; --card2:#273449; --accent:#38bdf8;
    --accent2:#818cf8; --ok:#22c55e; --ng:#ef4444; --text:#e2e8f0;
    --muted:#94a3b8; --line:#334155; --code:#0b1220;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"Segoe UI","Hiragino Kaku Gothic ProN","Meiryo",sans-serif;
    background:linear-gradient(160deg,#0f172a,#111a33);
    color:var(--text); line-height:1.7; min-height:100vh;
  }
  .wrap{max-width:760px;margin:0 auto;padding:20px 16px 60px;}
  header h1{font-size:1.4rem;margin:0 0 4px;}
  header p{color:var(--muted);margin:0;font-size:.85rem;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-top:18px;box-shadow:0 8px 30px rgba(0,0,0,.25);}
  h2{font-size:1.1rem;margin:0 0 12px;}
  .btn{
    display:block;width:100%;text-align:left;cursor:pointer;
    background:var(--card2);color:var(--text);border:1px solid var(--line);
    border-radius:12px;padding:14px 16px;margin:8px 0;font-size:1rem;
    transition:.15s;
  }
  .btn:hover{border-color:var(--accent);transform:translateY(-1px);}
  .btn.primary{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#0b1220;font-weight:700;border:none;text-align:center;}
  .btn small{display:block;color:var(--muted);font-size:.78rem;font-weight:400;margin-top:2px;}
  .btn.primary small{color:#0b1220;opacity:.75;}
  .row{display:flex;gap:10px;flex-wrap:wrap;}
  .row .btn{flex:1;min-width:120px;margin:0;}
  .topbar{display:flex;justify-content:space-between;align-items:center;font-size:.85rem;color:var(--muted);margin-bottom:6px;}
  .progress{height:8px;background:var(--code);border-radius:99px;overflow:hidden;margin-bottom:16px;}
  .progress > div{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0;transition:.3s;}
  .chip{display:inline-block;font-size:.72rem;padding:2px 10px;border-radius:99px;background:var(--code);color:var(--accent);border:1px solid var(--line);margin-bottom:10px;}
  .q{font-size:1.08rem;font-weight:600;margin:0 0 4px;white-space:pre-wrap;}
  pre{background:var(--code);border:1px solid var(--line);border-radius:10px;padding:12px 14px;overflow-x:auto;font-family:"Consolas","Courier New",monospace;font-size:.9rem;color:#c7d2fe;margin:10px 0;}
  .opt{
    display:block;width:100%;text-align:left;cursor:pointer;
    background:var(--card2);color:var(--text);border:1px solid var(--line);
    border-radius:12px;padding:12px 14px;margin:8px 0;font-size:.98rem;transition:.12s;
    white-space:pre-wrap;
  }
  .opt:hover:not(:disabled){border-color:var(--accent);}
  .opt:disabled{cursor:default;opacity:1;}
  .opt.correct{background:rgba(34,197,94,.16);border-color:var(--ok);}
  .opt.wrong{background:rgba(239,68,68,.16);border-color:var(--ng);}
  .opt code{font-family:"Consolas",monospace;}
  .fb{margin-top:12px;padding:12px 14px;border-radius:12px;font-size:.92rem;display:none;}
  .fb.show{display:block;}
  .fb.ok{background:rgba(34,197,94,.12);border:1px solid var(--ok);}
  .fb.ng{background:rgba(239,68,68,.12);border:1px solid var(--ng);}
  .fb b{color:var(--accent);}
  .nav{display:flex;justify-content:flex-end;margin-top:14px;}
  .score{font-size:2.6rem;font-weight:800;text-align:center;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;margin:6px 0;}
  .muted{color:var(--muted);font-size:.85rem;}
  .review{border-top:1px solid var(--line);padding-top:12px;margin-top:12px;}
  .review .q{font-size:.95rem;}
  .review .ans{font-size:.88rem;margin:2px 0 0;}
  .review .ans .c{color:var(--ok);}
  .review .ans .w{color:var(--ng);}
  /* 学習（解説集・フラッシュカード） */
  .sec-lead{color:var(--muted);font-size:.85rem;margin:0 0 12px;}
  .count{font-size:.78rem;color:var(--muted);}
  .gnav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px;}
  .gnav button{font-size:.8rem;padding:6px 12px;border-radius:99px;background:var(--card2);color:var(--text);border:1px solid var(--line);cursor:pointer;transition:.12s;}
  .gnav button:hover{border-color:var(--accent);}
  .gnav button.active{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#0b1220;border:none;font-weight:700;}
  .story{background:var(--code);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:12px;padding:14px 16px;margin:10px 0 18px;font-size:.95rem;line-height:1.95;}
  .story b{color:var(--accent);font-weight:700;}
  .tcard{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:11px 14px;margin:8px 0;}
  .tcard .t{font-weight:700;color:var(--accent);font-size:1rem;margin-bottom:2px;}
  .tcard .d{font-size:.9rem;line-height:1.7;}
  .fcard{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:18px;padding:34px 20px;min-height:190px;display:flex;flex-direction:column;justify-content:center;text-align:center;cursor:pointer;user-select:none;transition:.12s;animation:fcin .18s ease;}
  @keyframes fcin{from{opacity:.3;transform:scale(.98)}to{opacity:1;transform:scale(1)}}
  .fcard:hover{border-color:var(--accent);}
  .fcard .side{font-size:.72rem;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;margin-bottom:12px;}
  .fcard .ft{font-size:1.5rem;font-weight:800;line-height:1.4;}
  .fcard .fd{font-size:1.02rem;line-height:1.85;}
  .fcard .hint{font-size:.76rem;color:var(--muted);margin-top:16px;}
  .fc-bar{display:flex;gap:8px;margin-top:12px;}
  .fc-bar button{flex:1;padding:11px 8px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--text);cursor:pointer;font-size:.9rem;transition:.12s;}
  .fc-bar button:hover{border-color:var(--accent);}
  footer{text-align:center;color:var(--muted);font-size:.75rem;margin-top:28px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>📚 データベース応用 テスト対策</h1>
    <p>鶴岡高専・データベース応用｜四択の用語問題＋SQLコード問題</p>
  </header>
  <div id="app"></div>
  <footer>資料（第1〜10回）の記述に基づく練習問題です。実際の出題を保証するものではありません。</footer>
</div>

<script>
/* ============ 問題データ ============ */
/* type: term=用語四択 / code=コード四択  ch=章  */
const BANK = [
/* ---------- 第1回：DB基礎 ---------- */
{ch:"第1回",type:"term",q:"「大量のデータを整理して保存し、必要なときにすぐ取り出せるようにした『データの倉庫』」を指す言葉は？",opts:["データベース（DB）","データモデル","トランザクション","スキーマ"],a:0,exp:"データベース（DB）＝大量のデータを整理して保存し、必要なときにすぐ取り出せる「データの倉庫」。"},
{ch:"第1回",type:"term",q:"表（テーブル）形式でデータを管理し、MySQL・PostgreSQL・Oracleが代表例のDBは？",opts:["リレーショナルデータベース","NoSQLデータベース","階層型データベース","ネットワーク型データベース"],a:0,exp:"リレーショナルDB＝表（テーブル）形式でデータを管理。Excelの表に近いイメージ。現在の主流。"},
{ch:"第1回",type:"term",q:"柔軟な形式でデータを保存し、SNSやビッグデータに適したDBは？（例：MongoDB, Redis）",opts:["NoSQLデータベース","リレーショナルデータベース","階層型データベース","表計算ソフト"],a:0,exp:"NoSQL＝柔軟な形式でデータを保存。SNSやビッグデータに適している。"},
{ch:"第1回",type:"term",q:"「1件分のデータ（表の1行）」を表す用語は？",opts:["レコード（行）","フィールド（列）","テーブル","キー"],a:0,exp:"レコード（行）＝1件分のデータ。例：「田中太郎」の情報1行分。"},
{ch:"第1回",type:"term",q:"「データの項目（表の列）」を表す用語は？",opts:["フィールド（列）","レコード（行）","テーブル","タプル"],a:0,exp:"フィールド（列）＝データの項目。例：「氏名」「学部」「学生ID」。"},
{ch:"第1回",type:"term",q:"データベースに命令を出すための専用言語の略称は？",opts:["SQL","HTML","DBMS","URL"],a:0,exp:"SQL（Structured Query Language）＝データベースに命令を出すための専用言語。"},
{ch:"第1回",type:"term",q:"SQLの基本操作CRUDのうち、「データを取得する（SELECT）」に当たるのは？",opts:["READ","CREATE","UPDATE","DELETE"],a:0,exp:"CRUD：C=CREATE(追加/INSERT)、R=READ(取得/SELECT)、U=UPDATE(更新)、D=DELETE(削除)。"},
{ch:"第1回",type:"term",q:"「SQL」の正式名称は？",opts:["Structured Query Language","Simple Query Logic","System Query Language","Standard Question Language"],a:0,exp:"SQL = Structured Query Language。"},

/* ---------- 第3回：データモデル・正規化 ---------- */
{ch:"第3回",type:"term",q:"「現実世界のデータ構造をコンピュータ上で再現するための抽象的ルール・構造」を指す言葉は？",opts:["データモデル","データベース","エンティティ","インデックス"],a:0,exp:"データモデル＝現実世界のデータ構造をコンピュータ上で再現するための抽象的ルール・構造。「データの管理方法を決める設計図」。"},
{ch:"第3回",type:"term",q:"ツリー構造（親子関係）でデータを管理し、1対多を表す最初期のデータモデルは？",opts:["階層型データモデル","ネットワーク型データモデル","リレーショナル型データモデル","ドキュメント型"],a:0,exp:"階層型モデル＝ツリー構造（親子関係）。1対多。IBMのIMSで実用化。"},
{ch:"第3回",type:"term",q:"グラフ構造で多対多を表現でき、CODASYLによって標準化されたデータモデルは？",opts:["ネットワーク型データモデル","階層型データモデル","リレーショナル型データモデル","キー・バリュー型"],a:0,exp:"ネットワーク型モデル＝グラフ／ネットワーク構造。多対多を表現。CODASYL（コダシル）で標準化。"},
{ch:"第3回",type:"term",q:"E.F.コードにより1970年に提唱され、データを行と列（テーブル形式）で管理するモデルは？",opts:["リレーショナル型データモデル","階層型データモデル","ネットワーク型データモデル","NoSQL"],a:0,exp:"リレーショナル型＝行と列（テーブル形式）で管理。E.F.コードが1970年に提唱。現在の主流DBの基盤。"},
{ch:"第3回",type:"term",q:"「テーブル内で一意に識別する項目」を表すキーは？",opts:["主キー（Primary Key）","外部キー（Foreign Key）","候補キー","スーパーキー"],a:0,exp:"主キー（Primary Key）＝テーブル内で一意に識別する項目。重複不可・NULL不可。"},
{ch:"第3回",type:"term",q:"「他テーブルの主キーを参照する項目」を表すキーは？",opts:["外部キー（Foreign Key）","主キー（Primary Key）","複合キー","代理キー"],a:0,exp:"外部キー（Foreign Key）＝他テーブルの主キーを参照する項目。テーブル同士を紐づける。"},
{ch:"第3回",type:"term",q:"「表内のすべての値が単一の値になるようにする」正規形は？",opts:["第1正規形","第2正規形","第3正規形","ボイスコッド正規形"],a:0,exp:"第1正規形＝表内のすべての値を「単一の値」にする。カンマ区切りを1行ずつ分割。"},
{ch:"第3回",type:"term",q:"「主キーの一部に依存する属性を別表に分割する（部分依存の排除）」正規形は？",opts:["第2正規形","第1正規形","第3正規形","第4正規形"],a:0,exp:"第2正規形＝主キーの一部にだけ依存する属性（部分関数従属）を別表に分離する。"},
{ch:"第3回",type:"term",q:"「非キー属性が別の非キー属性に依存しないように分割する（推移的従属の排除）」正規形は？",opts:["第3正規形","第2正規形","第1正規形","第5正規形"],a:0,exp:"第3正規形＝非キー属性間の依存（推移的従属）を解消する。例：教師名→教師住所を教師表に分ける。"},
{ch:"第3回",type:"term",q:"NoSQLのうち、JSONやBSON形式で1件のデータを保存する種類は？（代表：MongoDB）",opts:["ドキュメント型","グラフ型","カラム型","キー・バリュー型"],a:0,exp:"ドキュメント型＝JSON/BSON形式で保存。柔軟なスキーマ。代表：MongoDB、CouchDB。"},
{ch:"第3回",type:"term",q:"NoSQLのうち、キーと値のペアでシンプルに超高速なのは？（代表：Redis）",opts:["キー・バリュー型","ドキュメント型","グラフ型","カラム型"],a:0,exp:"キー・バリュー型＝キーと値のペア。シンプルで超高速。代表：Redis、DynamoDB。"},
{ch:"第3回",type:"term",q:"多対多の関係を表現するために導入する、2つの表の間をつなぐ表を何という？",opts:["中間テーブル（関係テーブル）","仮想テーブル","一時テーブル","親テーブル"],a:0,exp:"多対多は「中間テーブル（関係テーブル）」を導入して「1対多＋1対多」に分解する。"},

/* ---------- 第4回：設計・ER図 ---------- */
{ch:"第4回",type:"term",q:"「管理したい対象（人・物・出来事）」を表すER図の用語は？（例：学生、科目、教師）",opts:["エンティティ（Entity）","属性（Attribute）","リレーションシップ","ドメイン"],a:0,exp:"エンティティ（Entity）＝管理したい対象（人・物・出来事）。例：学生、科目、教師、教室。"},
{ch:"第4回",type:"term",q:"「エンティティが持つ性質や情報項目」を表す用語は？（例：学籍番号、氏名、学年）",opts:["属性（Attribute）","エンティティ","リレーションシップ","カーディナリティ"],a:0,exp:"属性（Attribute）＝エンティティが持つ性質や情報項目。学生→学籍番号、氏名、学年。"},
{ch:"第4回",type:"term",q:"「エンティティ同士のつながり」を表すER図の用語は？（例：学生―履修―科目）",opts:["リレーションシップ（Relationship）","属性","主キー","インデックス"],a:0,exp:"リレーションシップ＝エンティティ同士の“つながり”。例：学生―履修―科目。"},
{ch:"第4回",type:"term",q:"データベース設計の3段階を正しい順に並べたものは？",opts:["概念設計 → 論理設計 → 物理設計","物理設計 → 論理設計 → 概念設計","論理設計 → 概念設計 → 物理設計","概念設計 → 物理設計 → 論理設計"],a:0,exp:"概念設計(ER図)→論理設計(テーブル定義・正規化)→物理設計(SQL/DBMS)。右に行くほど抽象→具体。"},
{ch:"第4回",type:"term",q:"ER図の基本記号で「関係」を表す図形は？",opts:["ひし形","矩形（長方形）","楕円","三角形"],a:0,exp:"ER図：矩形＝エンティティ、ひし形＝関係、楕円＝属性。"},
{ch:"第4回",type:"term",q:"「データベース管理システム」を表す略語は？",opts:["DBMS","DDL","DML","ACID"],a:0,exp:"DBMS＝データベース管理システム。データの保存・検索・更新を自動管理するソフトウェア。"},
{ch:"第4回",type:"term",q:"「本の索引」のように検索を高速化する仕組みは？",opts:["インデックス","トランザクション","ビュー","カーソル"],a:0,exp:"インデックス＝「本の索引」のようなもの。よく検索する列に付けると高速化。付けすぎると更新が遅くなる。"},
{ch:"第4回",type:"term",q:"「4桁固定の学籍番号」に最も適した、固定長文字列のデータ型は？",opts:["CHAR(n)","VARCHAR(n)","INT","TEXT"],a:0,exp:"CHAR(n)＝固定長文字列。4桁固定ならVARCHARよりCHAR(4)が効率的。"},

/* ---------- 第5回：DDL ---------- */
{ch:"第5回",type:"term",q:"データベースの「構造」を定義するための言語（CREATE/ALTER/DROP等）は？",opts:["DDL（Data Definition Language）","DML（Data Manipulation Language）","DCL","TCL"],a:0,exp:"DDL（Data Definition Language）＝データベースの構造を定義する言語。"},
{ch:"第5回",type:"term",q:"既存の表の構造（列の追加・削除・型変更など）を変更するDDLコマンドは？",opts:["ALTER","CREATE","DROP","SELECT"],a:0,exp:"ALTER TABLE＝既存の表の構造を変更する命令。列の追加・削除・型変更・制約追加など。"},
{ch:"第5回",type:"term",q:"「必ず値が必要（空欄＝NULLを許さない）」ことを示す制約は？",opts:["NOT NULL","UNIQUE","CHECK","DEFAULT"],a:0,exp:"NOT NULL＝空欄（NULL）を許さない制約。氏名・学籍番号など必須項目に使用。"},
{ch:"第5回",type:"term",q:"「値が重複しないようにする」制約は？（例：emailの重複禁止）",opts:["UNIQUE","NOT NULL","PRIMARY KEY","CHECK"],a:0,exp:"UNIQUE＝値が重複しないようにする制約。メールアドレスやユーザー名などに使用。"},
{ch:"第5回",type:"term",q:"「値が一定の条件を満たすかチェックし、不正なデータを防ぐ」制約は？（例：grade BETWEEN 1 AND 5）",opts:["CHECK","DEFAULT","UNIQUE","NOT NULL"],a:0,exp:"CHECK＝値が条件を満たすか確認する制約。例：CHECK(grade BETWEEN 1 AND 5)。"},
{ch:"第5回",type:"term",q:"「値を指定しなかった時に自動で入る値」を定める制約は？",opts:["DEFAULT","CHECK","UNIQUE","AUTO_INCREMENT"],a:0,exp:"DEFAULT＝値を指定しなかった時に自動で入る値。例：DEFAULT CURRENT_TIMESTAMP。"},
{ch:"第5回",type:"term",q:"「テーブル構造は残し、データだけを高速に全削除する」コマンドは？",opts:["TRUNCATE TABLE","DROP TABLE","DELETE","ALTER TABLE"],a:0,exp:"TRUNCATE TABLE＝テーブルは残し、データだけを高速に全削除。DELETEより高速（ログをほぼ書かない）。"},
{ch:"第5回",type:"term",q:"存在しない表をDROPしてもエラーにせず、安全に削除するために付ける句は？",opts:["IF EXISTS","IF NULL","WHERE","CASCADE"],a:0,exp:"DROP TABLE IF EXISTS テーブル名; ＝存在しない表でもエラーにならない。初期化スクリプトで習慣化推奨。"},

/* ---------- 第6回：DML・トランザクション ---------- */
{ch:"第6回",type:"term",q:"データベースに保存されているデータそのものを操作する言語（INSERT/UPDATE/DELETE）は？",opts:["DML（Data Manipulation Language）","DDL（Data Definition Language）","DCL","SQLite"],a:0,exp:"DML（Data Manipulation Language）＝データそのものを操作する言語。INSERT/UPDATE/DELETE。"},
{ch:"第6回",type:"term",q:"表に「新しい行（レコード）を追加する」DML命令は？",opts:["INSERT","UPDATE","DELETE","SELECT"],a:0,exp:"INSERT＝表に新しい行を追加する命令。INSERT INTO テーブル名(列...) VALUES(値...);"},
{ch:"第6回",type:"term",q:"UPDATE文やDELETE文で「これを忘れると全件が変更／削除される」ため最重要な句は？",opts:["WHERE句","ORDER BY句","GROUP BY句","HAVING句"],a:0,exp:"WHERE句を忘れると全件が変更or削除される（実務で最も多い事故）。必ず確認してから実行。"},
{ch:"第6回",type:"term",q:"複数のDML操作を「すべて成功」か「すべて取り消し」のどちらかに保証する仕組みは？",opts:["トランザクション","インデックス","ビュー","サブクエリ"],a:0,exp:"トランザクション＝複数のDML操作を1つの処理単位として扱い、全成功か全取消を保証する仕組み。"},

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

/* 選択肢をシャッフルしても正解を追える形に */
function prepare(list){
  return list.map(o=>{
    const opts = o.opts.map((t,i)=>({t, ok:i===o.a}));
    return {...o, sOpts:shuffle(opts)};
  });
}

      <button class="btn primary" onclick="flashStart(-1)">🔀 全部（${GTERMS}語）をシャッフル</button>
      <div style="margin-top:10px">
        ${GLOSSARY.map((g,i)=>`<button class="btn" onclick="flashStart(${i})">${g.ch}<small>${g.terms.length}語</small></button>`).join('')}
      </div>
      <button class="btn" onclick="home()" style="margin-top:6px;text-align:center">← ホームに戻る</button>
    </div>`;
  window.scrollTo(0,0);
}
function flashStart(ci){
  fcScope = ci;
  let arr=[];
  if(ci<0) GLOSSARY.forEach(g=>g.terms.forEach(t=>arr.push({...t,ch:g.ch})));
  else GLOSSARY[ci].terms.forEach(t=>arr.push({...t,ch:GLOSSARY[ci].ch}));
  fcList = shuffle(arr); fcI=0; fcBack=false;
  flashRender(); window.scrollTo(0,0);
}
function flashFlip(){ fcBack=!fcBack; flashRender(); }
function flashNext(){ fcI=(fcI+1)%fcList.length; fcBack=false; flashRender(); }
function flashPrev(){ fcI=(fcI-1+fcList.length)%fcList.length; fcBack=false; flashRender(); }
function flashRender(){
  const c = fcList[fcI];
  const pct = Math.round((fcI+1)/fcList.length*100);
  app.innerHTML = `
    <div class="topbar"><span>${c.ch}</span><span class="count">${fcI+1} / ${fcList.length}</span></div>
    <div class="progress"><div style="width:${pct}%"></div></div>
    <div class="card">
      <div class="fcard" onclick="flashFlip()">
        ${fcBack
          ? `<div class="side">裏 · 意味</div><div class="fd">${esc(c.d)}</div>`
          : `<div class="side">表 · 用語</div><div class="ft">${esc(c.t)}</div><div class="hint">タップして意味を表示</div>`}
      </div>
      <div class="fc-bar">
        <button onclick="flashPrev()">← 前</button>
        <button onclick="flashFlip()">${fcBack?'用語に戻す':'めくる'}</button>
        <button onclick="flashNext()">次 →</button>
      </div>
      <div class="fc-bar" style="margin-top:8px">
        <button onclick="flashStart(${fcScope})">🔀 シャッフル</button>
        <button onclick="flashHome()">範囲変更</button>
        <button onclick="home()">ホーム</button>
      </div>
    </div>`;
}

function chTitle(c){
  return {
    "第1回":"データベースの基礎・SQL/CRUD",
    "第3回":"データモデル・正規化・NoSQL",
    "第4回":"データベース設計・ER図",
    "第5回":"DDL・制約",
    "第6回":"DML・トランザクション",
    "第7回":"SELECT・JOIN・集約",
    "第8回":"サブクエリ・ビュー"
  }[c]||"";
}

function start(mode){
  let list;
  examMode = (mode==='exam');
  if(mode==='exam'){
    // 本番：用語45問＋コード5問（不足分は全問）＝最大50問
    const terms = shuffle(BANK.filter(x=>x.type==='term')).slice(0,45);
    const codes = shuffle(BANK.filter(x=>x.type==='code')).slice(0,5);
    list = shuffle([...terms,...codes]);
  } else if(mode==='all'){
    // 用語15問＋コード5問を目安に混ぜる
    const terms = shuffle(BANK.filter(x=>x.type==='term')).slice(0,15);
    const codes = shuffle(BANK.filter(x=>x.type==='code')).slice(0,5);
    list = shuffle([...terms,...codes]);
  } else if(mode==='term'){
    list = shuffle(BANK.filter(x=>x.type==='term'));
  } else if(mode==='code'){
    list = shuffle(BANK.filter(x=>x.type==='code'));
  } else if(mode.startsWith('ch:')){
    list = shuffle(BANK.filter(x=>x.ch===mode.slice(3)));
  }
  quiz = prepare(list);
  idx=0;correct=0;wrongList=[];
  stopTimer();
  if(examMode){ timeLeft = 50*60; startTimer(); }
  render();
}

function startTimer(){
  timerId = setInterval(()=>{
    timeLeft--;
    const el=document.getElementById('timer');
    if(el) el.textContent='⏱ '+fmtTime(timeLeft);
    if(timeLeft<=0){ stopTimer(); result(true); }
  },1000);
}
function stopTimer(){ if(timerId){clearInterval(timerId);timerId=null;} }
function fmtTime(s){const m=Math.floor(s/60);const ss=s%60;return m+':'+String(ss).padStart(2,'0');}

function render(){
  answered=false;
  const q = quiz[idx];
  const pct = Math.round((idx)/quiz.length*100);
  const tag = q.type==='code' ? 'SQLコード問題' : '用語問題';
  app.innerHTML = `
    <div class="topbar"><span>第 ${idx+1} / ${quiz.length} 問</span><span>${examMode?`<span id="timer">⏱ ${fmtTime(timeLeft)}</span>`:`正解 ${correct}`}</span></div>
    <div class="progress"><div style="width:${pct}%"></div></div>
    <div class="card">
      <span class="chip">${q.ch}・${tag}</span>
      <p class="q">${esc(q.q)}</p>
      ${q.code?`<pre>${esc(q.code)}</pre>`:''}
      <div id="opts">
        ${q.sOpts.map((o,i)=>`<button class="opt" data-i="${i}" onclick="choose(${i})">${esc(o.t)}</button>`).join('')}
      </div>
      <div id="fb" class="fb"></div>
      <div class="nav" id="nav"></div>
    </div>`;
}

function choose(i){
  if(answered) return;
  answered=true;
  const q = quiz[idx];
  const chosen = q.sOpts[i];
  const btns = [...document.querySelectorAll('.opt')];
  btns.forEach((b,j)=>{
    b.disabled=true;
    if(q.sOpts[j].ok) b.classList.add('correct');
    if(j===i && !chosen.ok) b.classList.add('wrong');
  });
  const fb = document.getElementById('fb');
  if(chosen.ok){
    correct++;
    fb.className='fb show ok';
    fb.innerHTML=`⭕ 正解！<br><b>解説：</b>${esc(q.exp)}`;
  }else{
    const ans = q.sOpts.find(o=>o.ok).t;
    fb.className='fb show ng';
    fb.innerHTML=`❌ 不正解。正解は「${esc(ans)}」<br><b>解説：</b>${esc(q.exp)}`;
    wrongList.push({q, chosen:chosen.t, ans});
  }
  const nav=document.getElementById('nav');
  const last = idx===quiz.length-1;
  nav.innerHTML=`<button class="btn primary" style="width:auto;padding:10px 24px" onclick="next()">${last?'結果を見る ▶':'次の問題 ▶'}</button>`;
}

function next(){
  if(idx===quiz.length-1){ result(); return; }
  idx++; render();
}

function result(timeUp){
  stopTimer();
  const total=quiz.length;
  const pct=Math.round(correct/total*100);
  let msg = pct===100?"満点！完璧です🎉":pct>=80?"good！あと少し💪":pct>=60?"合格ライン。復習しよう📖":"要復習。資料を見直そう🔥";
  const pts = examMode ? `<div class="score">${correct*2} 点 <span style="font-size:1rem;color:var(--muted)">/ ${total*2}点</span></div>` : `<div class="score">${correct} / ${total}</div>`;
  app.innerHTML=`
    <div class="card" style="text-align:center">
      <h2>結果${timeUp?'（時間切れ）':''}</h2>
      ${pts}
      <p class="muted">正解 ${correct}/${total}　正答率 ${pct}%　${msg}</p>
      <div class="row" style="margin-top:14px">
        <button class="btn primary" onclick="home()">最初に戻る</button>
        <button class="btn" onclick="retry()" style="text-align:center">もう一度（同じ範囲）</button>
      </div>
    </div>
    ${wrongList.length?`
    <div class="card">
      <h2>間違えた問題（${wrongList.length}）</h2>
      ${wrongList.map(w=>`
        <div class="review">
          <p class="q">${esc(w.q.q)}</p>
          ${w.q.code?`<pre>${esc(w.q.code)}</pre>`:''}
          <p class="ans"><span class="w">あなた：${esc(w.chosen)}</span></p>
          <p class="ans"><span class="c">正解：${esc(w.ans)}</span></p>
          <p class="ans muted">${esc(w.q.exp)}</p>
        </div>`).join('')}
    </div>`:`<div class="card" style="text-align:center">全問正解！間違いはありません✨</div>`}
  `;
  window.scrollTo(0,0);
}

let lastMode=null;
const _start=start;
start=function(m){lastMode=m;_start(m);};
function retry(){ quiz=prepare(shuffle(quiz)); idx=0;correct=0;wrongList=[]; render(); window.scrollTo(0,0);}

home();
</script>
</body>
</html>
